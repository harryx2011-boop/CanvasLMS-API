[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvaslms-api"
version = "1.0.1"
description = "CanvasLMS - API: an MCP server that puts your Canvas LMS account in front of an AI assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Harry Xie" }]
keywords = ["canvas", "lms", "mcp", "claude", "education"]
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
canvaslms-api = "canvaslms_api.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/harryx2011-boop/CanvasLMS-API"

[tool.hatch.build.targets.wheel]
packages = ["src/canvaslms_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
